    <text x="90" y="290" fill="#f0f6fc" font-size="62" font-weight="700">ArasaniRohithReddy</text>
    <text x="90" y="360" fill="#cdd7e2" font-size="50" font-weight="700">Repositories</text>
    <text x="90" y="440" fill="#9da7b3" font-size="28">Search, filter and share every repository —</text>
    <text x="90" y="478" fill="#9da7b3" font-size="28">access enforced by GitHub.</text>
    <text x="90" y="570" fill="#9da7b3" font-size="28" font-weight="600">arasanirohithreddy.github.io</text>
  </g>

  <g transform="translate(90 505)">
    <rect width="120" height="12" rx="6" fill="#f1e05a"/>
    <rect x="132" width="90" height="12" rx="6" fill="#3178c6"/>
    <rect x="234" width="70" height="12" rx="6" fill="#b07219"/>
    <rect x="316" width="50" height="12" rx="6" fill="#3572A5"/>
  </g>

  <g transform="translate(900 210)" fill="none" stroke="#58a6ff" stroke-width="6" opacity="0.85">
    <rect x="0" y="0" width="100" height="100" rx="20"/>
    <rect x="140" y="0" width="100" height="100" rx="20"/>
    <rect x="0" y="140" width="100" height="100" rx="20"/>
